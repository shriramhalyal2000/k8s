apiVersion: app/v1
kind: Deployment
metadata:
  name: nginx-deployment
  lables: 
     app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec: 
      conatiners:
      - name: nginx
        image: nginx:1.16
        ports:
        - ContainerPort: 8080 